<title id="title">Поверхность вокруг Автозаводской</title><desc id="desc">Игровая схема по карте игрока. Москва-река и Нагатинский рукав, станции и полупрозрачные линии метро. Автозаводская — база, ЗИЛ — первая сюжетная цель.</desc>
