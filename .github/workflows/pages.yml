name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: /dist/
          sparse-checkout-cone-mode: false
      - name: Check deployment files
        run: test -s dist/index.html
      - uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          name: github-pages
          path: dist
          retention-days: 7
      - name: Check uploaded artifact
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: test -n "$ARTIFACT_ID"
      - name: Wait for Pages artifact in GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        shell: bash
        run: |
          response_file="$RUNNER_TEMP/pages-artifacts.json"
          for attempt in {1..6}; do
            status=$(curl --silent --show-error --retry 2 \
              --output "$response_file" --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")
            echo "Attempt $attempt/6: GitHub API HTTP $status"
            if [[ "$status" != "200" ]]; then
              jq -r '.message // "No API error message"' "$response_file"
              if [[ "$status" == "401" || "$status" == "403" ]]; then
                exit 1
              fi
            else
              jq '{total_count, artifacts: [.artifacts[] | {id, name, expired}]}' "$response_file"
              if jq -e --arg id "$ARTIFACT_ID" \
                '.artifacts[] | select((.id | tostring) == $id and .name == "github-pages" and .expired == false)' \
                "$response_file" > /dev/null; then
                echo "Uploaded Pages artifact is available through GitHub API."
                exit 0
              fi
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 10
            fi
          done
          echo "::error::Uploaded Pages artifact was not visible through GitHub API after six checks."
          exit 1
      - name: Deploy Pages using uploaded artifact ID
        uses: actions/github-script@v8
        id: deployment
        timeout-minutes: 12
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const artifactId = process.env.ARTIFACT_ID;
            if (!/^\d+$/.test(artifactId || '')) {
              throw new Error('Missing or invalid uploaded artifact ID');
            }
            const numericArtifactId = Number(artifactId);
            if (!Number.isSafeInteger(numericArtifactId) || numericArtifactId <= 0) {
              throw new Error('Uploaded artifact ID is outside the supported numeric range');
            }
            const repository = context.repo;
            const oidcToken = await core.getIDToken();
            const { data: deployment } = await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments',
              {
                ...repository,
                artifact_id: numericArtifactId,
                pages_build_version: context.sha,
                oidc_token: oidcToken
              }
            );
            core.info('Created Pages deployment ' + deployment.id);
            core.setOutput('page_url', deployment.page_url);
            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const { data: result } = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}',
                { ...repository, deployment_id: deployment.id }
              );
              core.info('Pages deployment status: ' + result.status);
              if (result.status === 'succeed') {
                core.notice('Published game: ' + deployment.page_url);
                return;
              }
              if (['errored', 'failed', 'cancelled', 'deployment_failed',
                   'deployment_content_failed', 'deployment_cancelled',
                   'deployment_lost', 'deployment_sync_failed'].includes(result.status)) {
                throw new Error('Pages deployment failed: ' + result.status);
              }
            }
            await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel',
              { ...repository, deployment_id: deployment.id }
            );
            throw new Error('Pages deployment exceeded the ten-minute timeout');
