name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: /dist/
          sparse-checkout-cone-mode: false
      - name: Check deployment files
        run: test -s dist/index.html
      - uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          name: github-pages
          path: dist
          retention-days: 7
      - name: Check uploaded artifact
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: test -n "$ARTIFACT_ID"
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages
